version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: buildlink-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: assignment_db
    volumes:
      - mysql_data_buildlink_007:/var/lib/mysql
      - ./BuildLink/DB清理/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - buildlink-net

  app:
    build:
      context: ./BuildLink
      dockerfile: Dockerfile
    container_name: buildlink-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      DB_NAME: assignment_db
      NODE_ENV: development
    ports:
      - "20254:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - buildlink-net
    # ★★★ 修正：解除註解並正確縮排 ★★★
    volumes:
      - ./BuildLink:/app
      - /app/node_modules
    command: nodemon -L app.js

volumes:
  mysql_data_buildlink_007:
    external: false

networks:
  buildlink-net:
    driver: bridge